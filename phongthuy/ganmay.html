<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gắn máy - Tạo Video Phong Thủy 1 Chạm</title>
<link rel="stylesheet" href="style.css"></head>
<body><div class="card" style="text-align:center">
  <h1>Gắn máy này</h1>
  <div id="form">
    <p class="sub">Nhập email <b>hoặc</b> số điện thoại bạn đã dùng khi mua tool. Chỉ cần làm một lần cho mỗi máy.</p>
    <label for="may" style="text-align:left">Mã máy này (tự nhận)</label>
    <input id="may" type="text" readonly maxlength="8" autocapitalize="characters" autocomplete="off" style="text-align:center;letter-spacing:.15em;opacity:.85;cursor:not-allowed">
    <p class="note" id="hint" style="text-align:left"></p>
    <label for="em" style="text-align:left">Email đã mua</label>
    <input id="em" type="email" autocomplete="email" placeholder="ten@gmail.com">
    <label for="ph" style="text-align:left">Hoặc số điện thoại đã mua</label>
    <input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912345678">
    <button class="btn main" id="go" type="button">GẮN MÁY NÀY</button>
    <p class="msg err" id="msg"></p>
  </div>
  <div id="done" class="hide">
    <h2>Đã gắn máy</h2>
    <p class="sub" id="okmsg"></p>
    <p class="note">Quay lại thẻ tool, đợi 1 đến 2 phút, tool tự vào. Nếu chưa vào, hãy tải lại tool.</p>
  </div>
  <a class="btn ghost" href="index.html">Quay lại</a>
</div>
<script src="common.js"></script>
<script>
  var mayEl = $('may');
  function manual() {
    mayEl.readOnly = false; mayEl.style.cursor = 'text'; mayEl.style.opacity = '1'; mayEl.placeholder = 'Nhập mã máy 8 ký tự';
    $('hint').textContent = 'Không tự nhận được mã máy. Mã hiện ở màn Kích hoạt trong tool, dòng "Mã máy", gõ đúng 8 ký tự.';
  }
  function computeId(cb) {
    try {
      var AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var gpu = function () { try { var c = document.createElement('canvas'); var gl = c.getContext('webgl') || c.getContext('experimental-webgl'); if (!gl) return 'nogl'; var ext = gl.getExtension('WEBGL_debug_renderer_info'); var v = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR); var r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); return String(v) + '|' + String(r); } catch (e) { return 'nogl'; } };
      var touch = Number(navigator.maxTouchPoints) || 0, y = new Date().getFullYear();
      var parts = [gpu(), 'c' + (navigator.hardwareConcurrency || 0), 'p' + (navigator.platform || ''), 't' + touch, 'z' + (new Date(y, 0, 1).getTimezoneOffset() + '/' + new Date(y, 6, 1).getTimezoneOffset())];
      if (touch > 0) { var a = screen.width, b = screen.height; parts.push('s' + Math.min(a, b) + 'x' + Math.max(a, b)); }
      if (!window.crypto || !crypto.subtle) return cb('');
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.join('#'))).then(function (buf) {
        var h = new Uint8Array(buf), id = '';
        for (var i = 0; i < 8; i++) id += AL[h[i] % 32];
        cb(id);
      }, function () { cb(''); });
    } catch (e) { cb(''); }
  }
  var fromLink = String(params().may || '').toUpperCase();
  if (isDeviceId(fromLink)) mayEl.value = fromLink;
  else computeId(function (id) { if (isDeviceId(id)) mayEl.value = id; else manual(); });
  function fail(m) { var e = $('msg'); e.textContent = m; e.className = 'msg err'; $('go').disabled = false; }
  $('go').onclick = function () {
    var may = String(mayEl.value || '').trim().toUpperCase();
    var em = $('em').value.trim(), ph = $('ph').value.trim();
    if (!isDeviceId(may)) return fail('Chưa có mã máy. Hãy đợi một giây rồi bấm lại, hoặc mở trang này từ nút "Sao chép link gắn máy" trong tool.');
    if (!em && !ph) return fail('Hãy nhập email hoặc số điện thoại đã dùng khi mua.');
    $('go').disabled = true; $('msg').textContent = 'Đang xử lý...'; $('msg').className = 'msg';
    callApi({ action: 'ganmay', may: may, email: em, phone: ph }).then(function (r) {
      if (!r || !r.ok) return fail((r && r.msg) || 'Chưa gắn được máy, vui lòng thử lại.');
      $('form').classList.add('hide'); $('done').classList.remove('hide'); $('okmsg').textContent = r.msg || '';
    }).catch(function () { fail('Có lỗi kết nối, vui lòng thử lại.'); });
  };
</script></body></html>
