<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cài đặt - Tạo Video Phong Thủy 1 Chạm</title>
<link rel="stylesheet" href="style.css"></head>
<body><div class="card">
  <h2 id="h">Đang xử lý...</h2>
  <p class="sub" id="msg">Trang này sẽ tự đóng, bạn quay lại tool nhé.</p>
  <button class="btn main hide" id="close" type="button">Đóng trang này</button>
</div>
<script src="common.js"></script>
<script>
  // Tool mở trang này: #a=save|load|login&ma=<mã kích hoạt>&s=<mã cài đặt khi lưu>. Kết quả trả về tool bằng postMessage.
  // Mã kích hoạt được nhớ ngay trên trình duyệt này (localStorage của trang github.io, không đi đâu khác),
  // lần sau tool chỉ cần mở trang với a=login là lấy lại được mã.
  var P = params();
  var KEY = 'pt1c_ma';
  function getSaved() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setSaved(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  var ma = P.a === 'login' ? getSaved() : (P.ma || '');
  function done(res) {
    var ok = !!(res && res.ok);
    var titles = { save: 'Đã lưu cài đặt', load: 'Đã nạp cài đặt', login: 'Đã nhận diện mã kích hoạt' };
    $('h').textContent = ok ? (titles[P.a] || 'Xong') : 'Chưa xử lý được';
    $('msg').textContent = (res && res.msg) || 'Có lỗi, vui lòng thử lại.';
    try {
      if (window.opener) window.opener.postMessage({
        type: 'PT1C_SETTINGS', action: P.a, ok: ok,
        settings: (res && res.settings) || '', msg: (res && res.msg) || '', ma: ok && P.a === 'login' ? ma : ''
      }, '*');
    } catch (e) {}
    if (ok) setTimeout(function () { window.close(); }, 900);
    else { $('close').classList.remove('hide'); $('close').onclick = function () { window.close(); }; }
  }
  if (P.a !== 'save' && P.a !== 'load' && P.a !== 'login') done({ ok: false, msg: 'Liên kết không hợp lệ.' });
  else if (!ma) done({ ok: false, msg: P.a === 'login' ? 'Trình duyệt này chưa lưu mã kích hoạt. Hãy dán mã vào tool một lần.' : 'Liên kết không hợp lệ.' });
  else callApi(P.a === 'save' ? { action: 'luucaidat', ma: ma, caidat: P.s } : { action: 'docaidat', ma: ma })
    .then(function (res) {
      if (P.a === 'load' && res && res.ok) setSaved(ma);          // mã đúng: nhớ lại cho lần sau
      if (P.a === 'login' && !(res && res.ok)) setSaved('');       // mã không còn trên Sheet: quên
      done(res);
    })
    .catch(function () { done({ ok: false, msg: 'Có lỗi kết nối, vui lòng thử lại.' }); });
</script></body></html>
