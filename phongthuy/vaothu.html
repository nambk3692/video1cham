<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo Video Phong Thủy 1 Chạm</title>
<link rel="stylesheet" href="style.css">
<style>
  .login { text-align: left; margin: 0 0 12px; }
  .login label { display: block; font-size: 14px; margin: 0 0 6px; }
  .login input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; }
  .who { font-size: 14px; margin: 0 0 10px; }
  .who a { margin-left: 6px; }
  .msg { font-size: 14px; margin: 10px 0 0; }
  .msg.err { color: #b91c1c; }
  .msg.ok { color: #15803d; }
</style></head>
<body><div class="card" style="text-align:center">
  <h1 id="title">Tạo Video Phong Thủy 1 Chạm</h1>
  <p class="note" style="margin-top:0">Bản thử đăng nhập một lần</p>

  <div id="inapp" class="hide">
    <div class="warn">Bạn đang mở link trong ứng dụng (Zalo, Facebook, TikTok...). Trình duyệt trong ứng dụng không đăng nhập được Google nên sẽ không vào được tool. Hãy mở trang này bằng Chrome hoặc Safari.</div>
  </div>

  <div id="normal">
    <div class="login hide" id="loginBox">
      <label for="lienhe">Lần đầu vào tool trên máy này: nhập email hoặc số điện thoại bạn đã đăng ký</label>
      <input id="lienhe" type="text" inputmode="email" autocomplete="email" placeholder="Email hoặc số điện thoại">
    </div>
    <p class="who hide" id="who"></p>
    <button class="btn main" id="go" type="button" style="font-size:16px;padding:16px;width:100%">ĐÃ MUA TOOL, BẤM VÀO ĐÂY ĐỂ VÀO</button>
    <p class="msg hide" id="msg"></p>
    <a class="btn zalo" id="first" href="chonmua.html" style="font-size:16px;padding:16px">LẦN ĐẦU VÀO TOOL, BẤM ĐỂ ĐĂNG KÝ</a>
  </div>
</div>
<script>
  // BẢN THỬ: Apps Script triển khai thử + link tool thử (chưa phải bản khách)
  var API_THU = 'https://script.google.com/macros/s/AKfycbzixBGdA_V4eUXH-QpZnelHX5PkTT0H-4WFHYE3rS1mXUvj0WZLIf7TdIEU1RdjoiI9/exec';
  var TOOL_THU = 'https://flow.google.com/shared/tool/1fb84e93-7dc5-4601-bcf0-1fa00639c351';
  var KEY = 'pt1c_lienhe';
  var $ = function (id) { return document.getElementById(id); };
  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  function gpuName() {
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (!gl) return 'nogl';
      var ext = gl.getExtension('WEBGL_debug_renderer_info');
      var v = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
      var r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      return String(v) + '|' + String(r);
    } catch (e) { return 'nogl'; }
  }
  // Mã rút gọn của máy: giống mã máy của tool nhưng bỏ phần loại máy (platform)
  function maRutGon() {
    var nav = navigator;
    var touch = Number(nav.maxTouchPoints) || 0;
    var y = new Date().getFullYear();
    var zone = new Date(y, 0, 1).getTimezoneOffset() + '/' + new Date(y, 6, 1).getTimezoneOffset();
    var parts = [gpuName(), 'c' + (nav.hardwareConcurrency || 0), 't' + touch, 'z' + zone];
    if (touch > 0) parts.push('s' + Math.min(screen.width, screen.height) + 'x' + Math.max(screen.width, screen.height));
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.join('#'))).then(function (buf) {
      var h = new Uint8Array(buf), id = '';
      for (var i = 0; i < 8; i++) id += ALPHABET[h[i] % 32];
      return id;
    });
  }
  // Mã máy kiểu cũ của chính máy này (để nhận lại máy đã gắn ở cột Máy 1, Máy 2). Trên iPhone/iPad, tool trong Flow hay báo loại máy MacIntel.
  function maMayCu() {
    var nav = navigator;
    var touch = Number(nav.maxTouchPoints) || 0;
    var y = new Date().getFullYear();
    var zone = new Date(y, 0, 1).getTimezoneOffset() + '/' + new Date(y, 6, 1).getTimezoneOffset();
    var gpu = gpuName();
    var plats = [nav.platform || ''];
    if (touch > 0 && /apple/i.test(gpu)) ['MacIntel', 'iPhone', 'iPad'].forEach(function (p) { if (plats.indexOf(p) < 0) plats.push(p); });
    return Promise.all(plats.map(function (p) {
      var parts = [gpu, 'c' + (nav.hardwareConcurrency || 0), 'p' + p, 't' + touch, 'z' + zone];
      if (touch > 0) parts.push('s' + Math.min(screen.width, screen.height) + 'x' + Math.max(screen.width, screen.height));
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.join('#'))).then(function (buf) {
        var h = new Uint8Array(buf), id = '';
        for (var i = 0; i < 8; i++) id += ALPHABET[h[i] % 32];
        return id;
      });
    }));
  }
  function getSaved() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setSaved(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  function mask(v) {
    if (v.indexOf('@') >= 0) { var p = v.split('@'); return p[0].slice(0, 2) + '***@' + p[1]; }
    return '***' + v.replace(/\D/g, '').slice(-3);
  }
  function showMsg(t, ok) { var m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
  function render() {
    var s = getSaved();
    if (s) {
      $('loginBox').classList.add('hide');
      $('who').classList.remove('hide');
      $('who').innerHTML = 'Đã đăng nhập: <b>' + mask(s) + '</b> <a href="#" id="doi">Đổi tài khoản</a>';
      $('doi').onclick = function (e) { e.preventDefault(); setSaved(''); render(); };
    } else {
      $('who').classList.add('hide');
      $('loginBox').classList.remove('hide');
    }
  }

  var ua = navigator.userAgent;
  var inApp = /Zalo|FBAN|FBAV|FB_IAB|Instagram|Messenger|TikTok|musical_ly|Bytedance|BytedanceWebview|Line\/|; wv\)/i.test(ua);
  if (inApp) { $('inapp').classList.remove('hide'); $('normal').classList.add('hide'); }
  render();

  var busy = false;
  $('go').onclick = function () {
    if (busy) return;
    var lh = getSaved() || $('lienhe').value.trim();
    if (!lh) { showMsg('Hãy nhập email hoặc số điện thoại bạn đã đăng ký.'); $('lienhe').focus(); return; }
    busy = true;
    $('go').textContent = 'Đang vào tool...';
    showMsg('', true);
    Promise.all([maRutGon(), maMayCu()]).then(function (v) {
      return fetch(API_THU, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 've', lienhe: lh, ma: v[0], mays: v[1] }) })
        .then(function (r) { return r.json(); });
    }).then(function (r) {
      if (r && r.ok) {
        setSaved(lh);
        showMsg('Đang mở tool...', true);
        location.href = TOOL_THU;
        return;
      }
      if (r && r.chuaCo) setSaved('');
      render();
      showMsg((r && r.msg) || 'Chưa vào được, bạn bấm lại nhé.');
    }).catch(function () {
      showMsg('Mạng chậm hoặc lỗi, bạn bấm lại nhé.');
    }).then(function () {
      busy = false;
      $('go').textContent = 'ĐÃ MUA TOOL, BẤM VÀO ĐÂY ĐỂ VÀO';
    });
  };
</script></body></html>
