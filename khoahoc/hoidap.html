<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Hỏi trợ lý</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#fff; --card:#f4f6f8; --line:#cfd6de; --text:#111418; --muted:#4a5360; --accent:#0b6b3a; --err:#c0262d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:19px; height:100%; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding:12px 14px 6px; border-bottom:2px solid var(--line); flex-shrink:0; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:16px; line-height:1.4; }
  #list { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:8px 12px; }
  .bubble { max-width:90%; padding:10px 13px; border-radius:16px; margin:9px 0; font-size:19px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .bubble.me { margin-left:auto; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bubble.sup { margin-right:auto; background:var(--card); border:2px solid var(--line); border-bottom-left-radius:4px; }
  .bubble img { display:block; max-width:100%; border-radius:10px; margin-bottom:6px; }
  .muted { color:var(--muted); font-size:17px; }
  .compose { flex-shrink:0; padding:8px 12px 12px; border-top:2px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  textarea { width:100%; min-height:68px; padding:10px 12px; border-radius:14px; border:2px solid var(--line); font-size:19px; font-family:inherit; resize:none; }
  textarea:focus { outline:3px solid var(--accent); border-color:transparent; }
  .row { display:flex; gap:8px; }
  .btn { flex:1; min-height:54px; border-radius:14px; border:2px solid var(--accent); background:#fff; color:var(--accent); font-size:18px; font-weight:700; cursor:pointer; padding:0 8px; }
  .btn.main { background:var(--accent); color:#fff; }
  .btn:disabled { opacity:.5; }
  .hide { display:none !important; }
  .err:empty { display:none; }
  .err { color:var(--err); font-weight:600; font-size:17px; margin:0; min-height:20px; }
  .thumb { max-width:110px; max-height:110px; border-radius:10px; border:2px solid var(--line); }
  .note { font-size:15px; color:var(--muted); margin:0; line-height:1.4; }
  #gate { padding:18px 14px; }
  #gate input { width:100%; min-height:56px; border-radius:14px; border:2px solid var(--line); font-size:22px; padding:0 14px; text-transform:uppercase; letter-spacing:2px; }
</style>
</head>
<body>
<div id="topbar" class="hide" style="flex:0 0 auto">
  <button id="back" class="btn main" type="button" style="width:100%;min-height:54px;border-radius:0;border:0;font-size:20px">← Về tool</button>
</div>

<div id="gate" class="hide">
  <p>Nhập mã của bạn để được hỗ trợ:</p>
  <input id="gate-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Nhập mã">
  <p id="gate-err" class="err"></p>
  <button id="gate-go" class="btn main" type="button" style="width:100%">Vào hỏi</button>
</div>

<div id="main" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="list"></div>
  <div class="compose">
    <img id="pending" class="thumb hide" alt="">
    <textarea id="text" placeholder="Gõ câu hỏi hoặc gửi ảnh màn hình để được trả lời."></textarea>
    <div class="row">
      <button id="pic" class="btn" type="button">Gửi ảnh</button>
      <button id="shot" class="btn hide" type="button">Chụp màn hình</button>
      <button id="send" class="btn main" type="button">Gửi tin</button>
    </div>
    <input id="file" type="file" accept="image/*" class="hide">
    <p id="err" class="err"></p>
  </div>
</div>

<script>
(function () {
  // Nút to "Về tool": đóng khung hỏi để quay lại đúng tab tool đang làm dở
  var backBtn = document.getElementById('back');
  if (/(^|[#&])tool=/.test(location.hash)) {
    document.getElementById('topbar').classList.remove('hide');
    backBtn.addEventListener('click', function () {
      window.close();
      setTimeout(function () { if (history.length > 1) history.back(); }, 300);
    });
  }

  var DB = 'https://hotro-khoahoc-default-rtdb.asia-southeast1.firebasedatabase.app';
  var COURSE_API = 'https://script.google.com/macros/s/AKfycbzkV8lJV_-753BoCjMQZ0CriN8V2P5hG4pwci6rh_CJ80vZRMk0qnZVrR3m4SnI1iM/exec';
  var TOOL_NAMES = { tv1c: 'Tạo Video 1 Chạm', ed1c: 'Edit Video 1 Chạm', pt: 'Phong Thủy', sk: 'Sức Khỏe' };
  var KEYS = { tv1c: 'tv1c_ma', ed1c: 'ed1c_ma', pt: 'pt1c_ma', sk: 'sk1c_ma' };

  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

  // Mã và tên tool: ưu tiên lấy từ đường dẫn (#tool=sk&ma=...), không có thì lấy mã khóa học đã nhớ.
  var q = {};
  location.hash.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) { try { q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} } });
  var who = { tool: TOOL_NAMES[q.tool] ? q.tool : '', ma: String(q.ma || '').split('~')[0].trim().toUpperCase() };
  if (who.ma) { store('hd_ma', who.ma); store('hd_tool', who.tool); }
  else { who.ma = String(store('hd_ma') || store('kh_ma') || '').toUpperCase(); who.tool = store('hd_tool') || ''; }
  history.replaceState(null, '', location.pathname + location.search); // xóa mã khỏi thanh địa chỉ

  var msgs = {}, imgCache = {}, es = null, pendingImg = '', sending = false;

  function chatId() {
    var v = store('kh_chat');
    if (!v || v.length < 24) {
      var a = new Uint8Array(24); crypto.getRandomValues(a);
      v = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      store('kh_chat', v);
    }
    return v;
  }

  function put(path, body) {
    return fetch(DB + path + '.json', { method: 'PUT', body: JSON.stringify(body) }).then(function (r) { if (!r.ok) throw new Error('http'); return r; });
  }

  function openStream() {
    if (es) return;
    es = new EventSource(DB + '/chats/' + chatId() + '/msgs.json');
    es.addEventListener('put', function (e) {
      var d = JSON.parse(e.data), path = d.path || '/';
      if (path === '/') msgs = d.data || {};
      else {
        var parts = path.slice(1).split('/');
        if (parts.length === 1) { if (d.data === null) delete msgs[parts[0]]; else msgs[parts[0]] = d.data; }
        else { msgs[parts[0]] = msgs[parts[0]] || {}; msgs[parts[0]][parts[1]] = d.data; }
      }
      render();
    });
    es.addEventListener('patch', function (e) { var d = JSON.parse(e.data); if ((d.path || '/') === '/') { for (var k in d.data) msgs[k] = d.data[k]; } render(); });
    es.onerror = function () { try { es.close(); } catch (x) {} es = null; setTimeout(openStream, 4000); };
  }

  function render() {
    var box = $('list');
    var ids = Object.keys(msgs).filter(function (k) { return msgs[k] && msgs[k].t; }).sort(function (a, b) { return msgs[a].t - msgs[b].t; });
    box.innerHTML = '';
    if (!ids.length) { var h = document.createElement('p'); h.className = 'muted'; h.textContent = 'Chưa có tin nhắn. Bạn đang gặp khó ở đâu, cứ nhắn hoặc gửi ảnh màn hình nhé.'; box.appendChild(h); }
    ids.forEach(function (k) {
      var m = msgs[k], me = m.from === 'khach';
      var b = document.createElement('div'); b.className = 'bubble ' + (me ? 'me' : 'sup');
      if (m.hasImg) {
        var im = document.createElement('img'); im.alt = 'Ảnh';
        if (imgCache[k]) im.src = imgCache[k];
        else fetch(DB + '/chats/' + chatId() + '/img/' + k + '.json').then(function (r) { return r.json(); }).then(function (s) { if (s) { imgCache[k] = s; im.src = s; } }).catch(function () {});
        b.appendChild(im);
      }
      if (m.text) { var tx = document.createElement('span'); tx.textContent = m.text; b.appendChild(tx); }
      box.appendChild(b);
    });
    var last = ids.length ? msgs[ids[ids.length - 1]] : null;
    box.scrollTop = box.scrollHeight;
  }

  function devKind() {
    var ua = navigator.userAgent || '', touch = (navigator.maxTouchPoints || 0) > 1;
    var phone = /Android.*Mobile|iPhone|iPod/i.test(ua) || (touch && Math.min(screen.width, screen.height) < 600);
    var tablet = !phone && (/iPad|Android/i.test(ua) || (/Macintosh/i.test(ua) && touch));
    return phone ? 'dt' : (tablet ? 'mtb' : 'mt');
  }
    function send(textOverride) {
    if (sending) return;
    var text = (textOverride !== undefined ? textOverride : $('text').value).trim();
    if (!text && !pendingImg) return;
    sending = true; $('send').disabled = true; $('err').textContent = '';
    var cid = chatId();
    var mid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var t = Date.now();
    var m = { from: 'khach', t: t };
    if (text) m.text = text.slice(0, 2000);
    if (pendingImg) m.hasImg = true;
    var img = pendingImg;
    var name = 'Khách' + (who.tool ? ' ' + TOOL_NAMES[who.tool] : '');
    var meta = { name: name.slice(0, 80), ma: who.ma.slice(0, 40), dev: devKind() };
    if (who.tool) meta.tool = who.tool;
    var p = put('/chats/' + cid + '/meta', meta);
    if (img) p = p.then(function () { return put('/chats/' + cid + '/img/' + mid, img); });
    p.then(function () { return put('/chats/' + cid + '/msgs/' + mid, m); })
      .then(function () { return put('/inbox/' + cid, { t: t, last: (text || 'Ảnh').slice(0, 80) }); })
      .then(function () {
        if (img) imgCache[mid] = img;
        msgs[mid] = m; render();
        if (textOverride === undefined) $('text').value = '';
        pendingImg = ''; $('pending').classList.add('hide');
      })
      .catch(function () { $('err').textContent = 'Chưa gửi được. Kiểm tra mạng rồi bấm Gửi tin lại.'; })
      .then(function () { sending = false; $('send').disabled = false; });
  }
  $('send').addEventListener('click', function () { send(); });

  // ----- Gửi ảnh có sẵn (điện thoại và máy tính) -----
  function fitImage(img, max) {
    var w = img.width || img.videoWidth, h = img.height || img.videoHeight, s = Math.min(1, max / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var q = 0.75, out = c.toDataURL('image/jpeg', q);
    while (out.length > 450000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
    return out;
  }
  $('pic').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () { pendingImg = fitImage(im, 1100); var pi = $('pending'); pi.src = pendingImg; pi.classList.remove('hide'); };
      im.onerror = function () { $('err').textContent = 'Không đọc được ảnh này. Hãy thử ảnh khác.'; };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
    this.value = '';
  });

  // ----- Chụp màn hình (chỉ máy tính): chia sẻ một lần, chụp nhiều lần không hỏi lại -----
  var stream = null;
  var canShot = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) && !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (canShot) { $('shot').classList.remove('hide'); }

  function startShare() {
    return navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'monitor' }, audio: false, monitorTypeSurfaces: 'include', selfBrowserSurface: 'exclude' })
      .then(function (s) {
        stream = s;
        s.getVideoTracks()[0].addEventListener('ended', function () { stream = null; });
        return s;
      });
  }
  function grabFrame() {
    return new Promise(function (resolve, reject) {
      var v = document.createElement('video'); v.muted = true; v.playsInline = true; v.srcObject = stream;
      v.onloadedmetadata = function () {
        v.play().then(function () {
          setTimeout(function () { try { resolve(fitImage(v, 1500)); } catch (e) { reject(e); } }, 350);
        }).catch(reject);
      };
    });
  }
  $('shot').addEventListener('click', function () {
    $('err').textContent = '';
    var go = stream ? Promise.resolve() : startShare();
    go.then(grabFrame).then(function (data) {
      pendingImg = data; $('pending').src = data; $('pending').classList.remove('hide');
      send($('text').value.trim() || 'Xin xem giúp màn hình của tôi.');
      $('text').value = '';
    }).catch(function () { $('err').textContent = 'Chưa chụp được. Bấm "Chụp màn hình" và chọn Chia sẻ, hoặc dùng nút Gửi ảnh.'; });
  });

  // ----- Vào trang -----
  function start() { $('gate').classList.add('hide'); $('main').classList.remove('hide'); openStream(); render(); }
  if (who.ma) start();
  else {
    $('gate').classList.remove('hide');
    $('gate-go').addEventListener('click', function () {
      var code = $('gate-code').value.trim().toUpperCase();
      if (!code) { $('gate-err').textContent = 'Bạn chưa nhập mã.'; return; }
      who.ma = code; store('hd_ma', code); start();
    });
  }
})();
</script>
</body>
</html>
