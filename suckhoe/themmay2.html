<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thêm máy thứ hai - Tạo Video Sức Khỏe 1 Chạm</title>
<link rel="stylesheet" href="style.css"></head>
<body><div class="card" style="text-align:center">
  <h1>Thêm máy thứ hai</h1>
  <div id="form">
    <label for="ma" style="text-align:left">Mã kích hoạt cũ</label>
    <input id="ma" type="text" autocomplete="off" placeholder="Dán mã đã nhận vào đây">
    <label for="may" style="text-align:left">Mã máy này</label>
    <input id="may" type="text" readonly style="text-align:center;letter-spacing:.15em;opacity:.85;cursor:not-allowed">
    <button class="btn main" id="go" type="button">THÊM MÁY NÀY</button>
    <p class="msg err" id="err"></p>
  </div>
  <div id="done" class="hide">
    <h2>Thêm máy thành công</h2>
    <p class="sub" id="okmsg"></p>
    <div class="code" id="code"></div>
    <button class="btn main" id="cp" type="button">SAO CHÉP MÃ</button>
    <p class="note">Vào tool, dán mã này vào ô Mã kích hoạt.</p>
  </div>
  <a class="btn ghost" href="index.html">Quay lại</a>
</div>
<script src="common.js"></script>
<script>
  var inp = $('may');
  (function () {
    var AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    function gpu() { try { var c = document.createElement('canvas'); var gl = c.getContext('webgl') || c.getContext('experimental-webgl'); if (!gl) return 'nogl'; var ext = gl.getExtension('WEBGL_debug_renderer_info'); var v = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR); var r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); return String(v) + '|' + String(r); } catch (e) { return 'nogl'; } }
    var touch = Number(navigator.maxTouchPoints) || 0, y = new Date().getFullYear();
    var parts = [gpu(), 'c' + (navigator.hardwareConcurrency || 0), 'p' + (navigator.platform || ''), 't' + touch, 'z' + (new Date(y, 0, 1).getTimezoneOffset() + '/' + new Date(y, 6, 1).getTimezoneOffset())];
    if (touch > 0) { var a = screen.width, b = screen.height; parts.push('s' + Math.min(a, b) + 'x' + Math.max(a, b)); }
    if (!window.crypto || !crypto.subtle) return;
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(parts.join('#'))).then(function (buf) {
      var h = new Uint8Array(buf), id = '';
      for (var i = 0; i < 8; i++) id += AL[h[i] % 32];
      inp.value = id;
    });
  })();
  function fail(m) { var e = $('err'); e.textContent = m; e.className = 'msg err'; $('go').disabled = false; }
  $('go').onclick = function () {
    var ma = $('ma').value.replace(/[\s]+/g, '');
    var may = inp.value;
    if (!ma) return fail('Hãy dán mã kích hoạt đã nhận.');
    if (!isDeviceId(may)) return fail('Chưa nhận diện được mã máy. Hãy mở trang này bằng Chrome hoặc Safari.');
    $('go').disabled = true; $('err').textContent = 'Đang xử lý...'; $('err').className = 'msg';
    callApi({ action: 'themmay', ma: ma, may: may }).then(function (r) {
      if (!r.ok) return fail(r.msg || 'Chưa thêm được máy.');
      $('form').classList.add('hide'); $('done').classList.remove('hide');
      $('okmsg').textContent = r.msg || '';
      $('code').textContent = r.code;
      $('cp').onclick = function () { copyText(r.code, function (ok) { $('cp').textContent = ok ? 'ĐÃ SAO CHÉP' : 'Hãy bấm giữ mã để sao chép'; }); };
    }).catch(function () { fail('Có lỗi kết nối, vui lòng thử lại.'); });
  };
</script></body></html>
